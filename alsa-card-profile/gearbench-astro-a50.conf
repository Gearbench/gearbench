; Gearbench: the Astro A50 Gen 4 base station (USB 9886:002c), selected by
; Gearbench's WirePlumber rule, 60-gearbench-astro-a50.conf.
;
; PipeWire's usb-gaming-headset.conf gives Game and Chat one mixer path, so the
; two sinks share one port and GNOME lists them as one "Headphones" entry. The
; base station has no mixer controls, so the paths only named the ports. Here
; no mapping has a path, and GNOME lists each node under its own name: "Astro
; A50 Game" and "Astro A50 Chat" for the outputs, "Astro A50 Chat" for the mic.
; The mapping and profile names are upstream's, so the node names and the
; saved profile stay the same.
;
; Upstream's mono-chat output is left out: it does not open on this base
; station. stereo-chat is output only, which skips a stereo capture probe on
; the mono capture device.

[General]
auto-profiles = yes

[Mapping stereo-game]
description-key = gaming-headset-game
device-strings = hw:%f,1,0
channel-map = left,right
direction = output

[Mapping stereo-chat]
description-key = gaming-headset-chat
device-strings = hw:%f,0,0
channel-map = left,right
direction = output
intended-roles = phone

[Mapping mono-chat]
description-key = gaming-headset-chat
device-strings = hw:%f,0,0
channel-map = mono
direction = input
intended-roles = phone

[Profile output:stereo-game+output:stereo-chat+input:mono-chat]
output-mappings = stereo-game stereo-chat
input-mappings = mono-chat
priority = 5100
