; Gearbench: the Astro A50 X's base station (USB 046d:0b0b), selected by
; Gearbench's WirePlumber rule, 60-gearbench-astro-a50x.conf.
;
; The base station has the A50 Gen 4's layout: PCM 0 is Voice (playback,
; stereo) and the Mic (capture, mono), PCM 1 Game (playback, stereo) and
; Stream Out (capture, stereo). PipeWire's usb-gaming-headset.conf gives Game
; and Chat one mixer path, so the two outputs share one port, Headphones, and
; GNOME's Sound settings list one entry, Chat, where Game cannot be picked
; (the A50 X's write test, 2026-10-22). Here no mapping has a path, and GNOME
; lists each output under its own name: "A50 X Game" and "A50 X Chat", the
; headset's Voice, then "A50 X Chat" for the mic and Stream Out as an input,
; for streaming software to record. Each mapping name but stereo-stream,
; Stream Out's own, is upstream's, so those node names stay the same.
;
; The one profile is every mapping at once, so auto-profiles is off.

[General]
auto-profiles = no

[Mapping stereo-game]
description-key = gaming-headset-game
device-strings = hw:%f,1,0
channel-map = left,right
direction = output

[Mapping stereo-chat]
description-key = gaming-headset-chat
device-strings = hw:%f,0,0
channel-map = left,right
direction = output
intended-roles = phone

[Mapping mono-chat]
description-key = gaming-headset-chat
device-strings = hw:%f,0,0
channel-map = mono
direction = input
intended-roles = phone

[Mapping stereo-stream]
description = Stream Out
device-strings = hw:%f,1,0
channel-map = left,right
direction = input

[Profile output:stereo-game+output:stereo-chat+input:mono-chat+input:stereo-stream]
description = Game Output + Chat Output + Chat Input + Stream Out
output-mappings = stereo-game stereo-chat
input-mappings = mono-chat stereo-stream
priority = 5100
