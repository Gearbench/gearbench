# The gearbench system group, which 70-g502x.rules gives the G502 X PLUS's
# event nodes to, with no account in it. A package installs this file in
# /usr/lib/sysusers.d (sysusers.d(5)); the Arch package's script runs before the
# file is on disk and pipes a copy of the line below to systemd-sysusers.
g gearbench -
