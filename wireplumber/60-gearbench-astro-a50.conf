# Gearbench: the Astro A50 Gen 4 base station (USB 9886:002c).
#
# The card uses Gearbench's ACP profile set, gearbench-astro-a50.conf, where
# Game, Chat and the mic have no mixer path, so GNOME lists each under its own
# name. This rule wins over the ACP_PROFILE_SET that PipeWire's udev rule sets.
# api.alsa.use-ucm = false keeps the profile set if alsa-ucm-conf ever ships a
# profile for this card, which ACP would otherwise use first.
#
# Game ranks above Chat (1100) when WirePlumber picks a default output with
# nothing saved. WirePlumber's docs advise keeping a sink under 1500.
#
# Without a mixer path each output keeps its volume in WirePlumber's
# stream-properties; state.default-volume is the first level, the 0.064
# WirePlumber gives a new output route (40 % in GNOME), in place of 100 %.
#
# This file and the profile set go in and out together, the profile set first
# in and last out: a rule naming a profile set that is not there falls back to
# default.conf, which has no Game output. WirePlumber reads this file when it
# starts (systemctl --user restart wireplumber stops all audio for a moment).
monitor.alsa.rules = [
  {
    matches = [
      {
        device.vendor.id  = "0x9886"
        device.product.id = "0x002c"
      }
    ]
    actions = {
      update-props = {
        device.profile-set = "gearbench-astro-a50.conf"
        api.alsa.use-ucm   = false
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.usb-Astro_Gaming_Astro_A50-00.stereo-game" }
    ]
    actions = {
      update-props = {
        priority.session     = 1110
        state.default-volume = 0.064
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.usb-Astro_Gaming_Astro_A50-00.stereo-chat" }
    ]
    actions = {
      update-props = {
        state.default-volume = 0.064
      }
    }
  }
]
