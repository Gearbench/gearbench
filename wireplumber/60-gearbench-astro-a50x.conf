# Gearbench: the Astro A50 X base station (USB 046d:0b0b).
#
# The card uses Gearbench's ACP profile set, gearbench-astro-a50x.conf, where
# Game, Chat, the mic and Stream Out have no mixer path, so GNOME lists each
# under its own name. api.alsa.use-ucm = false keeps the profile set if
# alsa-ucm-conf ever ships a profile for this card, which ACP would otherwise
# use first.
#
# Game ranks above Chat (1100) when WirePlumber picks a default output with
# nothing saved. WirePlumber's docs advise keeping a sink under 1500. Without
# a mixer path each output starts at state.default-volume, in place of 100 %:
# 0.421875, 75 % in GNOME, which shows a volume as its cube root. At the
# 0.064 WirePlumber gives a new output route, 40 % in GNOME, Chat played
# too quiet. WirePlumber keeps each output's level from then on.
#
# This file and the profile set go in and out together, the profile set first
# in and last out: a rule naming a profile set that is not there falls back to
# default.conf, which has no Game output. WirePlumber reads this file when it
# starts (systemctl --user restart wireplumber stops all audio for a moment).
monitor.alsa.rules = [
  {
    matches = [
      {
        device.vendor.id  = "0x046d"
        device.product.id = "0x0b0b"
      }
    ]
    actions = {
      update-props = {
        device.profile-set = "gearbench-astro-a50x.conf"
        api.alsa.use-ucm   = false
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.usb-Logitech_A50_X-00.stereo-game" }
    ]
    actions = {
      update-props = {
        priority.session     = 1110
        state.default-volume = 0.421875
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.usb-Logitech_A50_X-00.stereo-chat" }
    ]
    actions = {
      update-props = {
        state.default-volume = 0.421875
      }
    }
  }
]
