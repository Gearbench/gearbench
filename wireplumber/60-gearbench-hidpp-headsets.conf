# Gearbench: the other headsets of the Logitech G432's family (USB 046d and
# the product ids below).
#
# Assumed from the G432's finding, and for each model's first connect to check
# (pw-dump of its card): each card has the G432's layout, one playback device
# with an analog and a digital (IEC958) profile, so it gets what
# 60-gearbench-logitech-g432.conf gives the G432, for the reasons that file
# gives.
#
# WirePlumber reads this file when it starts (systemctl --user restart
# wireplumber stops all audio for a moment).
monitor.alsa.rules = [
  {
    matches = [
      # Logitech G431
      {
        device.vendor.id  = "0x046d"
        device.product.id = "0x0a9b"
      }
      # Logitech G433
      {
        device.vendor.id  = "0x046d"
        device.product.id = "0x0a6d"
      }
      # Logitech G533
      {
        device.vendor.id  = "0x046d"
        device.product.id = "0x0a66"
      }
      # Logitech G535
      {
        device.vendor.id  = "0x046d"
        device.product.id = "0x0ac4"
      }
      # Logitech G633
      {
        device.vendor.id  = "0x046d"
        device.product.id = "0x0a5c"
      }
      # Logitech G635
      {
        device.vendor.id  = "0x046d"
        device.product.id = "0x0a89"
      }
      # Logitech G733
      {
        device.vendor.id  = "0x046d"
        device.product.id = "0x0ab5"
      }
      # Logitech G733
      {
        device.vendor.id  = "0x046d"
        device.product.id = "0x0afe"
      }
      # Logitech G733
      {
        device.vendor.id  = "0x046d"
        device.product.id = "0x0b1f"
      }
      # Logitech G933
      {
        device.vendor.id  = "0x046d"
        device.product.id = "0x0a5b"
      }
      # Logitech G935
      {
        device.vendor.id  = "0x046d"
        device.product.id = "0x0a87"
      }
      # Logitech PRO X Wireless
      {
        device.vendor.id  = "0x046d"
        device.product.id = "0x0aba"
      }
    ]
    actions = {
      update-props = {
        device.profile-set = "analog-only.conf"
        api.alsa.use-ucm   = false
      }
    }
  }
]
