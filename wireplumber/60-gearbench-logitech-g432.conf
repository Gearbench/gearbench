# Gearbench: the Logitech G432's USB adapter (USB 046d:0a9c).
#
# PipeWire's default.conf gives the adapter's one playback device an analog
# and a digital (IEC958) profile. Only analog's path holds the adapter's own
# volume, its PCM control, and a switch between the two closes the device,
# which pauses players. PipeWire's own analog-only.conf is default.conf's
# analog mappings alone, the same names and paths, so the card keeps its
# analog output, with its node name, and its microphone, and loses the
# digital profiles. api.alsa.use-ucm = false keeps the profile set if
# alsa-ucm-conf ever ships a profile for this card, which ACP would otherwise
# use first.
#
# WirePlumber reads this file when it starts (systemctl --user restart
# wireplumber stops all audio for a moment).
monitor.alsa.rules = [
  {
    matches = [
      {
        device.vendor.id  = "0x046d"
        device.product.id = "0x0a9c"
      }
    ]
    actions = {
      update-props = {
        device.profile-set = "analog-only.conf"
        api.alsa.use-ucm   = false
      }
    }
  }
]
